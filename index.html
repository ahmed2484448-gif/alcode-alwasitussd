<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#07131d"
    >

    <meta
        name="description"
        content="تطبيق الكود الوسيط"
    >

    <link
        rel="stylesheet"
        href="style.css"
    >

    <link
        rel="manifest"
        href="manifest.json"
    >

    <title>تطبيق الكود الوسيط</title>
</head>


<body>

    <!-- ================================
         رأس الموقع
    ================================= -->

    <header class="top-header">

        <button
            id="themeButton"
            class="theme-button"
            type="button"
            aria-label="تغيير الوضع"
        >
            🌙
        </button>

        <div class="header-content">

            <h1>
                تطبيق الكود الوسيط
            </h1>

            <p>
                صدقة جارية عن روح شهداء عائلة فرج الله
            </p>

        </div>

    </header>


    <!-- ================================
         المحتوى
    ================================= -->

    <main class="container">


        <!-- اختيار جهة التحويل -->

        <section class="card">

            <h2>
                اختر جهة التحويل
            </h2>


            <div class="services-grid">


                <!-- جوال بي -->

                <button
                    class="service"
                    data-service="jawwal"
                    type="button"
                >

                    <div class="service-image">

                        <img
                            src="images/1.png"
                            alt="جوال بي"
                            onerror="this.style.display='none'"
                        >

                    </div>

                    <span>
                        جوال بي
                    </span>

                </button>


                <!-- بال بي -->

                <button
                    class="service"
                    data-service="palpay"
                    type="button"
                >

                    <div class="service-image">

                        <img
                            src="images/2.png"
                            alt="بال بي"
                            onerror="this.style.display='none'"
                        >

                    </div>

                    <span>
                        بال بي
                    </span>

                </button>


                <!-- بنك فلسطين -->

                <button
                    class="service"
                    data-service="bank"
                    type="button"
                >

                    <div class="service-image">

                        <img
                            src="images/3.png"
                            alt="بنك فلسطين"
                            onerror="this.style.display='none'"
                        >

                    </div>

                    <span>
                        بنك فلسطين
                    </span>

                </button>

            </div>

        </section>



        <!-- ================================
             طريقة الدفع
        ================================= -->

        <section class="card">

            <h2>
                اختر طريقة الدفع
            </h2>


            <div class="payment-grid">

                <button
                    class="payment-type"
                    data-type="friend"
                    type="button"
                >

                    <span class="payment-icon">
                        👤
                    </span>

                    <span>
                        الدفع لصديق
                    </span>

                </button>


                <button
                    class="payment-type"
                    data-type="merchant"
                    type="button"
                >

                    <span class="payment-icon">
                        🏪
                    </span>

                    <span>
                        الدفع لتاجر
                    </span>

                </button>

            </div>

        </section>



        <!-- ================================
             بيانات العملية
        ================================= -->

        <section class="card">

            <h2>
                بيانات العملية
            </h2>


            <div
                id="receiverGroup"
                class="input-group"
            >

                <label for="receiver">
                    رقم المستلم
                </label>

                <input
                    id="receiver"
                    type="tel"
                    inputmode="numeric"
                    autocomplete="off"
                    placeholder="أدخل رقم المستلم"
                >

            </div>


            <div
                id="amountGroup"
                class="input-group"
            >

                <label for="amount">
                    المبلغ
                </label>

                <input
                    id="amount"
                    type="number"
                    inputmode="decimal"
                    min="0"
                    step="0.01"
                    placeholder="أدخل المبلغ"
                >

            </div>


            <div
                id="notesGroup"
                class="input-group"
            >

                <label for="notes">
                    ملاحظات
                </label>

                <textarea
                    id="notes"
                    rows="3"
                    placeholder="ملاحظات اختيارية"
                ></textarea>

            </div>


            <button
                id="createButton"
                class="main-button"
                type="button"
            >
                إنشاء العملية
            </button>

        </section>



        <!-- ================================
             النتيجة
        ================================= -->

        <section
            id="resultSection"
            class="card result-card hidden"
        >

            <div class="success-icon">
                ✓
            </div>

            <h2>
                العملية جاهزة
            </h2>

            <p id="resultMessage">
                تم تجهيز العملية.
            </p>


            <div
                id="ussdCode"
                class="ussd-code"
            >
                —
            </div>


            <button
                id="callButton"
                class="main-button"
                type="button"
            >
                📞 الاتصال
            </button>

        </section>



        <!-- ================================
             السجل
        ================================= -->

        <section class="card history-card">

            <button
                id="historyToggle"
                class="history-toggle"
                type="button"
                aria-expanded="false"
            >

                <span>
                    📋 سجل الحركات
                </span>

                <span class="history-toggle-arrow">
                    ‹
                </span>

            </button>


            <div
                id="historyPanel"
                class="history-panel"
            >

                <div
                    id="historyContainer"
                    class="history-container"
                >
                </div>


                <button
                    id="clearHistoryButton"
                    class="clear-history-button"
                    type="button"
                >
                    🗑 حذف جميع الحركات
                </button>

            </div>

        </section>

    </main>



    <!-- ================================
         نافذة تأكيد الاتصال
    ================================= -->

    <div
        id="confirmModal"
        class="confirm-modal hidden"
    >

        <div class="confirm-overlay"></div>


        <div class="confirm-box">

            <div class="confirm-icon">
                📞
            </div>

            <h2>
                تأكيد الاتصال
            </h2>

            <p class="confirm-text">
                هل تريد تأكيد الاتصال وإكمال العملية؟
            </p>


            <div class="confirm-details">


                <div class="confirm-row">

                    <span>
                        الخدمة
                    </span>

                    <strong id="confirmService">
                        -
                    </strong>

                </div>


                <div
                    id="confirmPaymentRow"
                    class="confirm-row"
                >

                    <span>
                        طريقة الدفع
                    </span>

                    <strong id="confirmPayment">
                        -
                    </strong>

                </div>


                <div
                    id="confirmReceiverRow"
                    class="confirm-row"
                >

                    <span>
                        رقم المستلم
                    </span>

                    <strong id="confirmReceiver">
                        -
                    </strong>

                </div>


                <div
                    id="confirmAmountRow"
                    class="confirm-row"
                >

                    <span>
                        المبلغ
                    </span>

                    <strong id="confirmAmount">
                        -
                    </strong>

                </div>

            </div>


            <div class="confirm-buttons">

                <button
                    id="confirmCallButton"
                    class="confirm-yes"
                    type="button"
                >
                    ✓ نعم، تأكيد الاتصال
                </button>


                <button
                    id="cancelCallButton"
                    class="confirm-no"
                    type="button"
                >
                    إلغاء
                </button>

            </div>

        </div>

    </div>



    <!-- ================================
         أسفل الموقع
    ================================= -->

    <footer class="footer">

        <div>
            صدقة جارية
        </div>

    </footer>



    <!-- JavaScript -->
    <script src="script.js"></script>


</body>
</html>
